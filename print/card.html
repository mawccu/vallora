<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VALLORA business card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  /* 85 x 55 mm trim, 3 mm bleed all round.
     Keep all content inside .safe, which is 7 mm in from the page edge. */
  @page { size: 91mm 61mm; margin: 0; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #050505; }

  body {
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 300;
    color: #ece8e1;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 91mm;
    height: 61mm;
    overflow: hidden;
    background: #050505;
    break-after: page;
    page-break-after: always;
  }
  .card:last-child { break-after: auto; page-break-after: auto; }

  /* faint centre glow, the same move the site hero makes */
  .card::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, #1c1712 0%, #050505 62%);
  }

  .safe {
    position: absolute;
    inset: 7mm;
    display: flex;
  }

  .wordmark {
    font-weight: 200;
    text-transform: uppercase;
    letter-spacing: .42em;
    text-indent: .21em;
    margin: 0;
    line-height: 1;
  }

  .micro {
    font-size: 1.7mm;
    font-weight: 400;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #9a958d;
    margin: 0;
  }
  .micro em { font-style: normal; color: #c8813c; }

  /* ── front ── */
  .front .safe { flex-direction: column; align-items: center; justify-content: center; }
  .front .wordmark { font-size: 5.2mm; }
  .rule { width: 14mm; height: .18mm; background: #c8813c; margin: 3.4mm 0 2.8mm; }
  .front .tag { font-size: 1.75mm; letter-spacing: .3em; text-transform: uppercase; color: #9a958d; margin: 0; }

  .corners {
    position: absolute;
    inset: 7mm;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
  }
  .corners span { font-size: 1.45mm; letter-spacing: .2em; text-transform: uppercase; color: #6f6b65; }

  /* ── back ── */
  .back .safe { align-items: center; justify-content: space-between; gap: 5mm; }

  .info { display: flex; flex-direction: column; gap: 2.6mm; }
  .info .wordmark { font-size: 3.1mm; }
  .info dl { margin: 0; display: flex; flex-direction: column; gap: 1.7mm; }
  .info dt {
    font-size: 1.4mm; letter-spacing: .26em; text-transform: uppercase; color: #6f6b65;
    margin: 0 0 .5mm;
  }
  .info dd { margin: 0; font-size: 2.35mm; font-weight: 300; letter-spacing: .02em; color: #ece8e1; }

  /* Dark modules on a light tile. Inverted QR codes are not reliably
     supported by scanners, so the tile stays paper coloured. */
  .qr {
    flex: none;
    width: 24mm; height: 24mm;
    background: #ece8e1;
    padding: 3mm;              /* quiet zone, > 4 modules */
    display: flex;
  }
  .qr svg { width: 100%; height: 100%; display: block; }

  .scan { font-size: 1.4mm; letter-spacing: .24em; text-transform: uppercase; color: #6f6b65; margin: 1.6mm 0 0; text-align: center; }
  .qr-wrap { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<!-- FRONT -->
<section class="card front">
  <div class="safe">
    <p class="wordmark">VALLORA</p>
    <div class="rule"></div>
    <p class="tag">Not just clothing, a mindset</p>
  </div>
  <div class="corners">
    <span>31.9539&deg; N . 35.9106&deg; E</span>
    <span>Est. 2026</span>
  </div>
</section>

<!-- BACK -->
<section class="card back">
  <div class="safe">
    <div class="info">
      <p class="wordmark">VALLORA</p>
      <dl>
        <div>
          <dt>Instagram</dt>
          <dd>@vallorawear</dd>
        </div>
        <div>
          <dt>Online</dt>
          <dd>mawccu.github.io/vallora</dd>
        </div>
        <div>
          <dt>Orders</dt>
          <dd>By direct message</dd>
        </div>
      </dl>
      <p class="micro"><em>01</em> &nbsp;Phase 01 . Live now</p>
    </div>

</div>
      <p class="scan">Scan</p>
    </div>
  </div>
</section>

</body>
</html>
